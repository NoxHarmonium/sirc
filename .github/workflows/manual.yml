name: SIRC-1 Reference Manual

# Standalone (not chained into coverage.yml like sirc-vm.yml/sirc-tiledit.yml
# are): this builds a LaTeX PDF, an entirely different artifact from the
# Rust workspace those cover, and doesn't need their coverage upload. Path
# filters keep it from running on unrelated Rust-only changes, since
# installing TeX Live is the slow part of this job.
#
# Deliberately does NOT re-run `make check` for the Appendix D example
# programs (byte-sieve, faults, hardware-exception, software-exception,
# store-load): sirc-vm.yml's `examples` job already does that, unconditionally,
# on every push -- duplicating it here would just double CI time for the
# same signal. This job covers what nothing else does: the PDF actually
# builds, every cross-reference resolves, and every inline code listing in
# the manual assembles with the real toolchain.
#
# examples/**/*.sasm is in the path filter (not just examples/manual-examples/)
# because docs/reference/Makefile treats every example .sasm file as a PDF
# build input too -- Appendix D pulls several of them in directly via
# \lstinputlisting.
on:
  push:
    branches: ["main"]
    paths:
      - "docs/reference/**"
      - "examples/manual-examples/**"
      - "examples/**/*.sasm"
      - ".github/workflows/manual.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/reference/**"
      - "examples/manual-examples/**"
      - "examples/**/*.sasm"
      - ".github/workflows/manual.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Manual - Build and QA
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # texlive-extra-utils provides latexindent; the rest cover the
      # packages the manual actually uses (tcolorbox, bytefield, float,
      # eso-pic, fancyhdr, tikz-timing). If a build fails here on a missing
      # .sty, that's the first place to look.
      - name: Install LaTeX toolchain and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            graphviz \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-pictures \
            texlive-plain-generic \
            texlive-extra-utils

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: sirc-vm

      - name: Format check
        run: make format-check
        working-directory: ./docs/reference

      - name: Build PDF and check cross-references
        run: make all
        working-directory: ./docs/reference

      - name: Assemble listings extracted from the manual
        run: make objects
        working-directory: ./examples/manual-examples

      - uses: actions/upload-artifact@v7
        with:
          name: sirc-1-reference-manual
          path: ./docs/reference/SIRC-1-reference-manual.pdf
          if-no-files-found: error
