<svg xmlns="http://www.w3.org/2000/svg" width="760" height="756" viewBox="0 0 760 756">
  <defs>
    <style>
      .ink { fill: #24333c; font-family: 'Liberation Sans', Arial, sans-serif; }
      .heading { font-size: 19px; font-weight: 700; letter-spacing: .6px; }
      .subhead { font-size: 16px; font-weight: 700; }
      .label { font-size: 14px; }
      .detail { font-size: 13px; fill: #53616a; }
      .annotation { font-size: 12px; fill: #485962; font-style: italic; }
      .functional { fill: #e9eff2; stroke: #405863; stroke-width: 1.8; rx: 5; }
      .wire { fill: none; stroke: #405863; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .control { fill: none; stroke: #738793; stroke-width: 1.8; stroke-dasharray: 6 5; stroke-linejoin: round; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#405863" stroke-width="1.3"/>
    </marker>
    <marker id="controlArrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#738793" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="756" fill="#fff"/>
  <text class="ink heading" x="16" y="30">SIRC-1 EXCEPTION HANDLING</text>

  <!-- Exception sources. -->
  <rect class="functional" x="16" y="52" width="224" height="100"/>
  <text class="ink subhead" x="128" y="76" text-anchor="middle">Faults</text>
  <text class="ink detail" x="128" y="98" text-anchor="middle">CPU error and debug conditions</text>
  <text class="ink detail" x="128" y="116" text-anchor="middle">Priority 7 · vectors 0x01–0x09</text>
  <text class="ink detail" x="128" y="134" text-anchor="middle">Nested fault = double fault</text>

  <rect class="functional" x="268" y="52" width="224" height="100"/>
  <text class="ink subhead" x="380" y="76" text-anchor="middle">Hardware Exceptions</text>
  <text class="ink detail" x="380" y="98" text-anchor="middle">IRQ1–IRQ5 pins</text>
  <text class="ink detail" x="380" y="116" text-anchor="middle">Priority 2–6 · vectors 0x10–0x50</text>
  <text class="ink detail" x="380" y="134" text-anchor="middle">L1–L4 maskable via SR.E1–E4</text>

  <rect class="functional" x="520" y="52" width="224" height="100"/>
  <text class="ink subhead" x="632" y="76" text-anchor="middle">Software Exceptions</text>
  <text class="ink detail" x="632" y="98" text-anchor="middle">EXCP instruction (traps)</text>
  <text class="ink detail" x="632" y="116" text-anchor="middle">Priority 1 · vectors 0x60–0xFF</text>
  <text class="ink detail" x="632" y="134" text-anchor="middle">Ignored while a handler is active</text>

  <path class="wire" d="M128 152 V194" marker-end="url(#arrow)"/>
  <path class="wire" d="M380 152 V194" marker-end="url(#arrow)"/>
  <path class="wire" d="M632 152 V194" marker-end="url(#arrow)"/>

  <!-- Exception coprocessor boundary. -->
  <rect x="16" y="196" width="728" height="376" rx="10" fill="#f8fafb" stroke="#6b7e88" stroke-width="2.4"/>
  <text class="ink subhead" x="36" y="222">EXCEPTION COPROCESSOR</text>
  <text class="ink detail" x="724" y="222" text-anchor="end">coprocessor ID 0x1</text>

  <rect class="functional" x="36" y="236" width="688" height="92"/>
  <text class="ink subhead" x="380" y="260" text-anchor="middle">Priority Arbitration</text>
  <text class="ink detail" x="380" y="282" text-anchor="middle">Pending hardware register: one bit per interrupt line</text>
  <text class="ink detail" x="380" y="300" text-anchor="middle">Current exception level (0–7): accepted only if the priority is higher; faults bypass this check</text>
  <text class="ink detail" x="380" y="318" text-anchor="middle">Dispatched at the next instruction boundary; retryable faults first cancel their instruction</text>

  <path class="wire" d="M380 328 V368" marker-end="url(#arrow)"/>
  <text class="ink annotation" x="388" y="353">selects register</text>

  <!-- Link registers. -->
  <rect class="functional" x="36" y="370" width="688" height="176"/>
  <text class="ink subhead" x="380" y="394" text-anchor="middle">Link Registers</text>
  <text class="ink annotation" x="708" y="394" text-anchor="end">registers 0–6: index = priority − 1</text>
  <line x1="52" y1="404" x2="708" y2="404" stroke="#b3c0c7"/>
  <text class="ink label" x="64" y="422">0</text>
  <text class="ink label" x="140" y="422">Software exceptions</text>
  <text class="ink detail" x="704" y="422" text-anchor="end">Priority 1</text>
  <line x1="52" y1="430" x2="708" y2="430" stroke="#d3dce1"/>
  <text class="ink label" x="64" y="448">1–5</text>
  <text class="ink label" x="140" y="448">Hardware exceptions, levels 1–5</text>
  <text class="ink detail" x="704" y="448" text-anchor="end">Priority 2–6</text>
  <line x1="52" y1="456" x2="708" y2="456" stroke="#d3dce1"/>
  <text class="ink label" x="64" y="474">6</text>
  <text class="ink label" x="140" y="474">Faults</text>
  <text class="ink detail" x="704" y="474" text-anchor="end">Priority 7</text>
  <line x1="52" y1="482" x2="708" y2="482" stroke="#d3dce1"/>
  <text class="ink label" x="64" y="500">7</text>
  <text class="ink label" x="140" y="500">Fault metadata</text>
  <text class="ink detail" x="704" y="500" text-anchor="end">bus address, access type, fault types</text>
  <line x1="52" y1="510" x2="708" y2="510" stroke="#b3c0c7"/>
  <text class="ink detail" x="380" y="532" text-anchor="middle">Registers 0–6 hold: return address · saved SR · saved level</text>

  <!-- The CSR is shared with the CU, so it sits outside the coprocessor boundary. -->
  <path class="wire" d="M602 572 V594" marker-end="url(#arrow)"/>
  <text class="ink annotation" x="610" y="588">populates</text>

  <rect class="functional" x="480" y="596" width="244" height="112"/>
  <text class="ink subhead" x="602" y="620" text-anchor="middle">Coprocessor Select</text>
  <text class="ink subhead" x="602" y="638" text-anchor="middle">Register (CSR)</text>
  <text class="ink detail" x="602" y="662" text-anchor="middle">16 bits: ID · operation · vector</text>
  <text class="ink detail" x="602" y="680" text-anchor="middle">Set when an exception is pending,</text>
  <text class="ink detail" x="602" y="698" text-anchor="middle">or by a COPI / COPR instruction</text>

  <path class="control" d="M478 652 H422" marker-start="url(#controlArrow)" marker-end="url(#controlArrow)"/>

  <rect class="functional" x="36" y="596" width="384" height="112"/>
  <text class="ink subhead" x="228" y="622" text-anchor="middle">Control Unit (CU)</text>
  <text class="ink detail" x="228" y="650" text-anchor="middle">Dispatches to the coprocessor the CSR selects</text>
  <text class="ink detail" x="228" y="668" text-anchor="middle">Fetches the vector and runs the entry</text>
  <text class="ink detail" x="228" y="686" text-anchor="middle">and RETE sequences</text>

  <text class="ink annotation" x="36" y="734">Reset (vector 0x00) bypasses arbitration and uses no link register.</text>

</svg>
