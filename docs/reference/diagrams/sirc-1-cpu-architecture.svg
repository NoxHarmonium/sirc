<svg xmlns="http://www.w3.org/2000/svg" width="760" height="912" viewBox="0 0 760 912">
  <defs>
    <style>
      .ink { fill: #24333c; font-family: 'Liberation Sans', Arial, sans-serif; }
      .heading { font-size: 19px; font-weight: 700; letter-spacing: .6px; }
      .subhead { font-size: 16px; font-weight: 700; }
      .label { font-size: 14px; }
      .detail { font-size: 12px; fill: #53616a; }
      .annotation { font-size: 12px; fill: #485962; font-style: italic; }
      .functional { fill: #e9eff2; stroke: #405863; stroke-width: 1.8; rx: 5; }
      .unit { fill: #f8fafb; stroke: #405863; stroke-width: 1.6; rx: 4; }
      .wire { fill: none; stroke: #405863; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .data { fill: none; stroke: #9b4b49; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .control { fill: none; stroke: #738793; stroke-width: 1.8; stroke-dasharray: 6 5; stroke-linejoin: round; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#405863" stroke-width="1.3"/>
    </marker>
    <marker id="dataArrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#9b4b49" stroke-width="1.5"/>
    </marker>
    <marker id="controlArrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#738793" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="912" fill="#fff"/>
  <text class="ink heading" x="16" y="30">SIRC-1 CPU ARCHITECTURE</text>

  <!-- Line key, top right. -->
  <rect x="330" y="8" width="414" height="34" rx="5" fill="#fff" stroke="#bcc9d0" stroke-width="1.3"/>
  <path class="wire" d="M342 25 H368" marker-end="url(#arrow)"/>
  <text class="ink detail" x="376" y="29">Data / result</text>
  <path class="control" d="M462 25 H488" marker-end="url(#controlArrow)"/>
  <text class="ink detail" x="496" y="29">CU control</text>
  <path class="data" d="M572 25 H598" marker-end="url(#dataArrow)"/>
  <text class="ink detail" x="606" y="29">Fetch / bus data</text>

  <!-- Solid chip boundary, with external devices visibly outside it. -->
  <rect x="16" y="52" width="728" height="596" rx="10" fill="#f8fafb" stroke="#6b7e88" stroke-width="2.4"/>
  <rect x="36" y="41" width="236" height="24" fill="#f8fafb"/>
  <text class="ink subhead" x="42" y="58">ON-CHIP · SIRC-1 CPU</text>
  <text class="ink subhead" x="64" y="690">OFF-CHIP</text>

  <!-- Control unit: shared fetch, decode and sequencing for every coprocessor. -->
  <rect class="functional" x="64" y="96" width="626" height="70"/>
  <text class="ink subhead" x="377" y="120" text-anchor="middle">Control Unit (CU)</text>
  <text class="ink detail" x="150" y="146" text-anchor="middle">Fetch + decode</text>
  <text class="ink detail" x="320" y="146" text-anchor="middle">Condition evaluation</text>
  <text class="ink detail" x="540" y="146" text-anchor="middle">Phase sequencing + coprocessor select register</text>

  <!-- Fetch path, and interrupt / reset / bus-error inputs from external devices. -->
  <path class="data" d="M64 540 H36 V82 H100 V94" marker-end="url(#dataArrow)"/>
  <text class="ink annotation" x="44" y="77">Fetch P0/P1: p, p+1</text>
  <path class="wire" d="M690 741 H716 V262 H692" marker-end="url(#arrow)"/>
  <text class="ink annotation" x="708" y="692" text-anchor="end">IRQ, reset and bus-error pins</text>

  <!-- CU dispatch to each coprocessor. -->
  <path class="control" d="M238 168 V206" marker-start="url(#controlArrow)" marker-end="url(#controlArrow)"/>
  <path class="control" d="M478 168 V206" marker-start="url(#controlArrow)" marker-end="url(#controlArrow)"/>
  <path class="control" d="M629 168 V206" marker-start="url(#controlArrow)" marker-end="url(#controlArrow)"/>
  <text class="ink annotation" x="246" y="192">CSR / dispatch</text>

  <!-- Coprocessor 0x0: processing unit. -->
  <rect class="functional" x="64" y="208" width="348" height="142"/>
  <text class="ink subhead" x="238" y="232" text-anchor="middle">Processing Unit</text>

  <rect class="unit" x="76" y="244" width="96" height="94"/>
  <text class="ink label" x="124" y="266" text-anchor="middle" style="font-weight:700">Barrel</text>
  <text class="ink label" x="124" y="284" text-anchor="middle" style="font-weight:700">Shifter</text>
  <text class="ink detail" x="124" y="306" text-anchor="middle">Operand A only</text>
  <text class="ink detail" x="124" y="322" text-anchor="middle">shift (P2)</text>

  <rect class="unit" x="190" y="244" width="96" height="94"/>
  <text class="ink label" x="238" y="266" text-anchor="middle" style="font-weight:700">ALU</text>
  <text class="ink detail" x="238" y="290" text-anchor="middle">Arithmetic</text>
  <text class="ink detail" x="238" y="306" text-anchor="middle">and logic</text>
  <text class="ink detail" x="238" y="322" text-anchor="middle">C, V, N, Z (P3)</text>

  <rect class="unit" x="304" y="244" width="96" height="94"/>
  <text class="ink label" x="352" y="266" text-anchor="middle" style="font-weight:700">Addressing</text>
  <text class="ink label" x="352" y="284" text-anchor="middle" style="font-weight:700">Unit</text>
  <text class="ink detail" x="352" y="306" text-anchor="middle">EA / base</text>
  <text class="ink detail" x="352" y="322" text-anchor="middle">Overflow (P3)</text>

  <path class="wire" d="M172 291 H188" marker-end="url(#arrow)"/>

  <!-- Other coprocessors: a fading stack signals that there can be several. -->
  <g opacity="0.3">
    <rect class="functional" x="442" y="224" width="104" height="142"/>
  </g>
  <g opacity="0.55">
    <rect class="functional" x="434" y="216" width="104" height="142"/>
  </g>
  <rect class="functional" x="426" y="208" width="104" height="142"/>
  <text class="ink subhead" x="478" y="236" text-anchor="middle" style="font-size:14px">Other</text>
  <text class="ink subhead" x="478" y="254" text-anchor="middle" style="font-size:14px">Coprocessors</text>
  <text class="ink detail" x="478" y="282" text-anchor="middle">Selected by</text>
  <text class="ink detail" x="478" y="298" text-anchor="middle">coprocessor ID</text>

  <!-- Coprocessor 0x1: exception coprocessor. -->
  <rect class="functional" x="568" y="208" width="122" height="142"/>
  <text class="ink subhead" x="629" y="236" text-anchor="middle">Exception</text>
  <text class="ink subhead" x="629" y="254" text-anchor="middle">Coprocessor</text>
  <text class="ink detail" x="629" y="280" text-anchor="middle">Faults · IRQ · reset</text>
  <text class="ink detail" x="629" y="296" text-anchor="middle">Priority arbitration</text>
  <text class="ink detail" x="629" y="312" text-anchor="middle">Link registers</text>
  <text class="ink detail" x="629" y="328" text-anchor="middle">Vectors via CU</text>

  <!-- Operands and results end at the shared interface. -->
  <path class="wire" d="M124 396 V340" marker-end="url(#arrow)"/>
  <text class="ink annotation" x="132" y="372">Op A</text>
  <path class="wire" d="M226 396 V340" marker-end="url(#arrow)"/>
  <text class="ink annotation" x="220" y="372" text-anchor="end">Op B</text>
  <path class="wire" d="M250 340 V394" marker-end="url(#arrow)"/>
  <text class="ink annotation" x="256" y="372">Result</text>
  <path class="wire" d="M316 396 V340" marker-end="url(#arrow)"/>
  <text class="ink annotation" x="322" y="372">Base/disp</text>
  <path class="wire" d="M388 340 V394" marker-end="url(#arrow)"/>
  <text class="ink annotation" x="394" y="372">EA, base</text>
  <path class="wire" d="M629 352 V394" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="ink annotation" x="621" y="368" text-anchor="end">Save / restore</text>
  <text class="ink annotation" x="621" y="382" text-anchor="end">p, sr, a, r7</text>
  <path class="wire" d="M494 368 V394" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Shared interface between all coprocessors and the register file and bus interface. -->
  <rect x="64" y="396" width="626" height="40" rx="5" fill="#d6e0e6" stroke="#405863" stroke-width="2"/>
  <text class="ink" x="377" y="421" text-anchor="middle"><tspan class="label" style="font-weight:700">Coprocessor Interface</tspan><tspan class="detail" dx="16">register and bus access, one active at a time</tspan></text>

  <path class="wire" d="M179 438 V478" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="wire" d="M542 438 V478" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Shared resources. -->
  <rect class="functional" x="64" y="480" width="230" height="130"/>
  <text class="ink subhead" x="179" y="504" text-anchor="middle">Bus Interface</text>
  <line x1="80" y1="514" x2="278" y2="514" stroke="#b3c0c7"/>
  <text class="ink detail" x="179" y="544" text-anchor="middle">Address + data</text>
  <text class="ink detail" x="179" y="564" text-anchor="middle">Bus wait handling</text>
  <text class="ink detail" x="179" y="584" text-anchor="middle">Phases 0, 1 and 4</text>

  <rect class="functional" x="394" y="480" width="296" height="130"/>
  <text class="ink subhead" x="542" y="504" text-anchor="middle">Register File</text>
  <line x1="410" y1="514" x2="674" y2="514" stroke="#b3c0c7"/>
  <text class="ink label" x="414" y="538">General: r1-r7</text>
  <text class="ink label" x="414" y="558">Address pairs: l, a, s, p</text>
  <text class="ink label" x="414" y="578">Status: sr (C, V, N, Z)</text>
  <text class="ink detail" x="542" y="600" text-anchor="middle">16-bit registers; 24-bit addresses</text>

  <path class="data" d="M296 545 H392" marker-start="url(#dataArrow)" marker-end="url(#dataArrow)"/>
  <text class="ink annotation" x="344" y="528" text-anchor="middle">LOAD / STOR</text>
  <text class="ink annotation" x="344" y="570" text-anchor="middle">data (P4)</text>

  <!-- Off-chip bus. -->
  <path class="wire" d="M190 610 V704" marker-end="url(#arrow)"/>
  <text class="ink detail" x="200" y="672">ADDR</text>
  <path class="data" d="M255 610 V704" marker-start="url(#dataArrow)" marker-end="url(#dataArrow)"/>
  <text class="ink detail" x="265" y="672">DATA</text>

  <rect x="64" y="706" width="626" height="70" rx="5" fill="#fff" stroke="#405863" stroke-width="2"/>
  <rect x="64" y="706" width="626" height="30" rx="5" fill="#e9eff2"/>
  <rect x="64" y="728" width="626" height="8" fill="#e9eff2"/>
  <text class="ink subhead" x="377" y="727" text-anchor="middle">External Devices (examples)</text>
  <text class="ink label" x="170" y="761" text-anchor="middle">RAM / ROM</text>
  <text class="ink label" x="377" y="761" text-anchor="middle">Memory-mapped I/O</text>
  <text class="ink label" x="584" y="761" text-anchor="middle">Other peripherals</text>

  <g transform="translate(0,-122)">
  <!-- Phase strip emphasizes sequential operation, not a pipeline. -->
  <text class="ink subhead" x="16" y="946">SIX SEQUENTIAL EXECUTION PHASES</text>
  <text class="ink detail" x="744" y="946" text-anchor="end">One active phase at a time · bus waits may extend a phase</text>
  <g class="ink">
    <rect x="16" y="962" width="114" height="56" rx="4" fill="#e9eff2" stroke="#9eafb8"/>
    <text class="subhead" x="26" y="984">0</text><text class="label" x="46" y="984">Fetch high</text><text class="detail" x="46" y="1004">bits 31-16</text>
    <rect x="139" y="962" width="114" height="56" rx="4" fill="#e9eff2" stroke="#9eafb8"/>
    <text class="subhead" x="149" y="984">1</text><text class="label" x="169" y="984">Fetch low</text><text class="detail" x="169" y="1004">bits 15-0</text>
    <rect x="262" y="962" width="114" height="56" rx="4" fill="#e9eff2" stroke="#9eafb8"/>
    <text class="subhead" x="272" y="984">2</text><text class="label" x="292" y="984">Decode / RF</text><text class="detail" x="292" y="1004">p low + 2</text>
    <rect x="384" y="962" width="114" height="56" rx="4" fill="#e9eff2" stroke="#9eafb8"/>
    <text class="subhead" x="394" y="984">3</text><text class="label" x="414" y="984">Execute</text><text class="detail" x="414" y="1004">ALU + AU</text>
    <rect x="507" y="962" width="114" height="56" rx="4" fill="#e9eff2" stroke="#9eafb8"/>
    <text class="subhead" x="517" y="984">4</text><text class="label" x="537" y="984">Memory</text><text class="detail" x="537" y="1004">LOAD / STOR</text>
    <rect x="630" y="962" width="114" height="56" rx="4" fill="#e9eff2" stroke="#9eafb8"/>
    <text class="subhead" x="640" y="984">5</text><text class="label" x="660" y="984">Write back</text><text class="detail" x="660" y="1004">registers / sr</text>
  </g>
  </g>
</svg>
