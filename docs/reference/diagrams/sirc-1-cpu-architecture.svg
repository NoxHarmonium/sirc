<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1034" viewBox="0 0 760 1034">
  <defs>
    <style>
      .ink { fill: #24333c; font-family: 'Liberation Sans', Arial, sans-serif; }
      .heading { font-size: 19px; font-weight: 700; letter-spacing: .6px; }
      .subhead { font-size: 16px; font-weight: 700; }
      .label { font-size: 14px; }
      .detail { font-size: 12px; fill: #53616a; }
      .annotation { font-size: 12px; fill: #485962; font-style: italic; }
      .functional { fill: #e9eff2; stroke: #405863; stroke-width: 1.8; rx: 5; }
      .wire { fill: none; stroke: #405863; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .data { fill: none; stroke: #9b4b49; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .control { fill: none; stroke: #738793; stroke-width: 1.8; stroke-dasharray: 6 5; stroke-linejoin: round; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#405863" stroke-width="1.3"/>
    </marker>
    <marker id="dataArrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#9b4b49" stroke-width="1.5"/>
    </marker>
    <marker id="controlArrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#738793" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="1034" fill="#fff"/>
  <text class="ink heading" x="16" y="30">SIRC-1 CPU ARCHITECTURE</text>

  <!-- Line key, top right. -->
  <rect x="330" y="8" width="414" height="34" rx="5" fill="#fff" stroke="#bcc9d0" stroke-width="1.3"/>
  <path class="wire" d="M342 25 H368" marker-end="url(#arrow)"/>
  <text class="ink detail" x="376" y="29">Data / result</text>
  <path class="control" d="M462 25 H488" marker-end="url(#controlArrow)"/>
  <text class="ink detail" x="496" y="29">CU control</text>
  <path class="data" d="M572 25 H598" marker-end="url(#dataArrow)"/>
  <text class="ink detail" x="606" y="29">Fetch / bus data</text>

  <!-- Solid chip boundary, with external devices visibly outside it. -->
  <rect x="16" y="52" width="728" height="708" rx="10" fill="#f8fafb" stroke="#6b7e88" stroke-width="2.4"/>
  <rect x="36" y="41" width="236" height="24" fill="#f8fafb"/>
  <text class="ink subhead" x="42" y="58">ON-CHIP · SIRC-1 CPU</text>
  <text class="ink subhead" x="64" y="806">OFF-CHIP</text>

  <!-- Row A: instruction register and control unit. -->
  <rect class="functional" x="64" y="96" width="210" height="86"/>
  <text class="ink subhead" x="169" y="124" text-anchor="middle">Instruction Register</text>
  <text class="ink detail" x="169" y="148" text-anchor="middle">32-bit instruction latch</text>
  <text class="ink detail" x="169" y="166" text-anchor="middle">high word + low word</text>

  <rect class="functional" x="370" y="96" width="320" height="86"/>
  <text class="ink subhead" x="530" y="120" text-anchor="middle">Control Unit (CU)</text>
  <text class="ink detail" x="530" y="142" text-anchor="middle">Opcode / operand decode</text>
  <text class="ink detail" x="530" y="158" text-anchor="middle">Condition evaluation</text>
  <text class="ink detail" x="530" y="174" text-anchor="middle">Phase sequencing + enables</text>

  <path class="wire" d="M274 139 H368" marker-end="url(#arrow)"/>
  <text class="ink annotation" x="321" y="129" text-anchor="middle">Decode</text>

  <!-- Row B: execute units. -->
  <rect class="functional" x="64" y="250" width="150" height="90"/>
  <text class="ink subhead" x="139" y="278" text-anchor="middle">Barrel Shifter</text>
  <text class="ink detail" x="139" y="300" text-anchor="middle">Operand A only</text>
  <text class="ink detail" x="139" y="318" text-anchor="middle">shift / rotate (P2)</text>

  <rect class="functional" x="264" y="250" width="190" height="90"/>
  <text class="ink subhead" x="359" y="278" text-anchor="middle">ALU</text>
  <text class="ink detail" x="359" y="300" text-anchor="middle">Arithmetic / logic</text>
  <text class="ink detail" x="359" y="318" text-anchor="middle">C, V, N, Z (P3)</text>

  <rect class="functional" x="514" y="250" width="176" height="90"/>
  <text class="ink subhead" x="602" y="278" text-anchor="middle">Addressing Unit</text>
  <text class="ink detail" x="602" y="300" text-anchor="middle">EA / base update</text>
  <text class="ink detail" x="602" y="318" text-anchor="middle">Segment check (P3)</text>

  <path class="wire" d="M214 295 H262" marker-end="url(#arrow)"/>

  <!-- Row C: register file. -->
  <rect class="functional" x="64" y="430" width="626" height="120"/>
  <text class="ink subhead" x="377" y="456" text-anchor="middle">Register File</text>
  <line x1="84" y1="468" x2="670" y2="468" stroke="#b3c0c7"/>
  <text class="ink label" x="84" y="494">General: r1-r7</text>
  <text class="ink label" x="226" y="494">Address pairs: l, a, s, p</text>
  <text class="ink detail" x="226" y="512">high / low halves</text>
  <text class="ink label" x="440" y="494">Status: sr (C, V, N, Z)</text>
  <text class="ink detail" x="377" y="538" text-anchor="middle">16-bit registers; 24-bit addresses</text>

  <!-- Operands up to the execute units; results back down. -->
  <path class="wire" d="M110 430 V342" marker-end="url(#arrow)"/>
  <text class="ink annotation" x="118" y="388">Op A</text>
  <path class="wire" d="M300 430 V342" marker-end="url(#arrow)"/>
  <text class="ink annotation" x="308" y="374">Op B (direct)</text>
  <path class="wire" d="M410 342 V428" marker-end="url(#arrow)"/>
  <text class="ink annotation" x="418" y="402">Result (P5)</text>
  <path class="wire" d="M560 430 V342" marker-end="url(#arrow)"/>
  <text class="ink annotation" x="568" y="374">Base / disp.</text>
  <path class="wire" d="M660 342 V428" marker-end="url(#arrow)"/>
  <text class="ink annotation" x="652" y="402" text-anchor="end">Base update</text>

  <!-- Row D: bus interface. -->
  <rect class="functional" x="64" y="640" width="626" height="90"/>
  <text class="ink subhead" x="377" y="664" text-anchor="middle">Bus Interface</text>
  <line x1="84" y1="676" x2="670" y2="676" stroke="#b3c0c7"/>
  <text class="ink detail" x="170" y="704" text-anchor="middle">Address + data</text>
  <text class="ink detail" x="377" y="704" text-anchor="middle">Bus wait handling</text>
  <text class="ink detail" x="584" y="704" text-anchor="middle">Phases 0, 1 and 4</text>

  <path class="data" d="M300 552 V638" marker-start="url(#dataArrow)" marker-end="url(#dataArrow)"/>
  <text class="ink annotation" x="310" y="598">LOAD / STOR data (P4)</text>
  <path class="wire" d="M690 295 H716 V685 H692" marker-end="url(#arrow)"/>
  <text class="ink annotation" x="708" y="598" text-anchor="end">Effective address</text>
  <path class="data" d="M64 685 H36 V82 H230 V94" marker-end="url(#dataArrow)"/>
  <text class="ink annotation" x="44" y="77">Fetch P0/P1: p, p+1</text>

  <!-- Control signals (representative, not literal wiring). -->
  <path class="control" d="M390 182 V215 H139 V248" marker-end="url(#controlArrow)"/>
  <path class="control" d="M430 182 V248" marker-end="url(#controlArrow)"/>
  <path class="control" d="M620 182 V248" marker-end="url(#controlArrow)"/>

  <!-- Off-chip bus. -->
  <path class="wire" d="M240 730 V828" marker-end="url(#arrow)"/>
  <text class="ink detail" x="250" y="792">ADDR</text>
  <path class="data" d="M520 730 V828" marker-start="url(#dataArrow)" marker-end="url(#dataArrow)"/>
  <text class="ink detail" x="530" y="792">DATA</text>

  <rect x="64" y="830" width="626" height="70" rx="5" fill="#fff" stroke="#405863" stroke-width="2"/>
  <rect x="64" y="830" width="626" height="30" rx="5" fill="#e9eff2"/>
  <rect x="64" y="852" width="626" height="8" fill="#e9eff2"/>
  <text class="ink subhead" x="377" y="851" text-anchor="middle">External Devices (examples)</text>
  <text class="ink label" x="170" y="885" text-anchor="middle">RAM / ROM</text>
  <text class="ink label" x="377" y="885" text-anchor="middle">Memory-mapped I/O</text>
  <text class="ink label" x="584" y="885" text-anchor="middle">Other peripherals</text>

  <!-- Phase strip emphasizes sequential operation, not a pipeline. -->
  <text class="ink subhead" x="16" y="946">SIX SEQUENTIAL EXECUTION PHASES</text>
  <text class="ink detail" x="744" y="946" text-anchor="end">One active phase at a time · bus waits may extend a phase</text>
  <g class="ink">
    <rect x="16" y="962" width="114" height="56" rx="4" fill="#e9eff2" stroke="#9eafb8"/>
    <text class="subhead" x="26" y="984">0</text><text class="label" x="46" y="984">Fetch high</text><text class="detail" x="46" y="1004">bits 31-16</text>
    <rect x="139" y="962" width="114" height="56" rx="4" fill="#e9eff2" stroke="#9eafb8"/>
    <text class="subhead" x="149" y="984">1</text><text class="label" x="169" y="984">Fetch low</text><text class="detail" x="169" y="1004">bits 15-0</text>
    <rect x="262" y="962" width="114" height="56" rx="4" fill="#e9eff2" stroke="#9eafb8"/>
    <text class="subhead" x="272" y="984">2</text><text class="label" x="292" y="984">Decode / RF</text><text class="detail" x="292" y="1004">p low + 2</text>
    <rect x="384" y="962" width="114" height="56" rx="4" fill="#e9eff2" stroke="#9eafb8"/>
    <text class="subhead" x="394" y="984">3</text><text class="label" x="414" y="984">Execute</text><text class="detail" x="414" y="1004">ALU + AU</text>
    <rect x="507" y="962" width="114" height="56" rx="4" fill="#e9eff2" stroke="#9eafb8"/>
    <text class="subhead" x="517" y="984">4</text><text class="label" x="537" y="984">Memory</text><text class="detail" x="537" y="1004">LOAD / STOR</text>
    <rect x="630" y="962" width="114" height="56" rx="4" fill="#e9eff2" stroke="#9eafb8"/>
    <text class="subhead" x="640" y="984">5</text><text class="label" x="660" y="984">Write back</text><text class="detail" x="660" y="1004">registers / sr</text>
  </g>
</svg>
